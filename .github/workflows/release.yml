name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.*.*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must be X.Y.Z or vX.Y.Z, for example v0.1.1.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::Release tags must point to a commit on main.'
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'

      - name: Publish executable
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish cli/Quodery.Cli.csproj --configuration Release -p:Version="$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: cli/bin/Release/net10.0/linux-x64/publish/quodery
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mv quodery quodery-linux-x64
          gh release create "$TAG" quodery-linux-x64 \
            --verify-tag \
            --title "Quodery $TAG" \
            --generate-notes
